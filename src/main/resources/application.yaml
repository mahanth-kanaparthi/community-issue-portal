spring:
  application:
    name: Community Issue Portal

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update # options: none, update, create, create-drop, validate
    show-sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwtSecret: "LongestStringIEverCreatedInMyEntireCareerSoFarOnFifthJanuary2026"
  jwtExpirationInMs: 36000000

---
# Development: MariaDB
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mariadb://localhost:3306/appdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: appuser
    password: rootpass
    driver-class-name: org.mariadb.jdbc.Driver

---
# Production: MySQL
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://localhost:3306/ipapp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${mysql_db_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
